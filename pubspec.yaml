name: api_scout
version: 5.0.0+11
publish_to: none
description: Reqistry — API intelligence for builders and agents
environment:
  sdk: ">=3.0.0 <4.0.0"

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  cached_network_image:
  connectivity_plus: ^6.1.5
  dio: ^5.4.0
  equatable: ^2.0.5
  envied: ^1.0.0
  firebase_core: ^4.13.0
  firebase_messaging: ^16.5.0
  flutter_bloc: ^8.1.3
  flutter_local_notifications: ^22.2.0
  flutter_markdown_plus:
  google_fonts:
  go_router: ^14.0.0
  hive:
  hive_flutter:
  in_app_review:
  intl: any
  share_plus:
  timezone: ^0.11.0
  url_launcher:
  flutter_svg:
  phosphoricons_flutter: ^1.0.0
  package_info_plus:
  device_preview_plus: 2.8.2
  requests_inspector: ^5.4.0

dev_dependencies:
  build_runner: ^2.4.0
  envied_generator: ^1.0.0
  hive_generator: ^2.0.1
  flutter_lints:
  flutter_test:
    sdk: flutter

flutter:
  generate: true
  uses-material-design: true
  assets:
    - assets/